<!doctype html>
<html lang="sr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover lets the app run under the status bar and home indicator,
      as the phone app does. maximum-scale=1 stops iOS zooming in when a text field
      with a font under 16px is focused, which would leave the page zoomed.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <title>GRIT</title>

    <!-- Added to the home screen, it opens full screen like an app, with its own icon and name. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GRIT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* The dark page shows before the app draws, instead of a white flash. */
        background: #0a0a0b;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* No grey flash on tap, no long-press callout on the app's own controls. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      /*
        The root is pinned to all four screen edges rather than sized by height.
        Opened from the iOS home screen, 100% / 100vh can resolve to less than the
        screen, which left a strip under the tab bar; a fixed box with inset 0
        spans the whole layout viewport under viewport-fit=cover.
      */
      #root {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <noscript>Za GRIT je potreban JavaScript.</noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Opened from the iOS home screen with a translucent status bar, the page is
      // told it is one status bar shorter than the screen, which left a black strip
      // under the tab bar. When that happens, the document and the root take the
      // real screen height: iOS paints only as far down as the document reaches,
      // so stretching the root alone left the tab bar cut off at the old edge.
      // Elsewhere — a Safari tab, other phones, a WebKit that reports it right —
      // the heights match and nothing changes.
      (function () {
        function fit() {
          var root = document.getElementById('root');
          if (!root) return;
          var standalone =
            window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          var short = standalone && window.innerHeight < window.screen.height;
          var height = short ? window.screen.height + 'px' : '';
          document.documentElement.style.height = height;
          document.body.style.height = height;
          root.style.height = height;
          root.style.bottom = short ? 'auto' : '';
        }
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', fit);
      })();
    </script>
  </body>
</html>
